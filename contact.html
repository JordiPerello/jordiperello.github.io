    <script>
        // L�gica del men� hamburguesa
function openModal() { document.getElementById('privacyModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('privacyModal').style.display = 'none'; }

        function tContact(key, fallback) {
            const locale = window.TourAiI18n?.getLocale() ?? 'es-ES';
            return window.TourAiI18n?.tOr(key, locale, null, fallback) ?? fallback;
        }

        function setVerificationBoxState({ visible, verified }) {
            window.TourAiForms?.renderEmailVerificationBox(
                {
                    boxId: 'emailVerificationBox',
                    messageId: 'emailVerificationMessage',
                    sendButtonId: 'sendVerificationBtn',
                },
                { visible, verified, showVerifyButton: false }
            );
        }

        function applyContactVerificationBox(email) {
            window.TourAiForms?.applyEmailVerificationBox(
                email,
                {
                    boxId: 'emailVerificationBox',
                    messageId: 'emailVerificationMessage',
                    sendButtonId: 'sendVerificationBtn',
                },
                'contact'
            );
        }

        function openContactVerifyModal() {
            window.TourAiEmailVerifyModal.open({
                onConfirm: confirmVerificationCode,
                onResend: resendVerificationCode,
            });
        }

        async function startEmailVerification() {
            if (window.TourAiLoading?.isVisible()) {
                window.TourAiForms?.allowAutoVerificationRetry?.(
                    document.getElementById('email').value
                );
                return;
            }

            const email = document.getElementById('email').value.trim();
            try {
                const result = await window.TourAiForms.sendContactVerificationCode(email);
                if (!result.ok) {
                    if (result.error === 'rate_limited') {
                        throw new Error(
                            window.TourAiForms.rateLimitedMessage(result, 'contact.verify.rateLimited')
                        );
                    }
                    throw new Error(
                        window.TourAiForms?.mapSendVerificationError?.(result) ??
                            tContact('forms.error.generic')
                    );
                }
                openContactVerifyModal();
            } catch (error) {
                window.TourAiForms?.allowAutoVerificationRetry?.(email);
                window.TourAiFeedback?.show({
                    type: 'error',
                    message: window.TourAiForms?.toUserFacingErrorMessage?.(error)
                        ?? tContact('forms.error.generic'),
                });
            } finally {
                validarForm();
            }
        }

        async function resendVerificationCode() {
            if (window.TourAiLoading?.isVisible()) {
                return;
            }

            try {
                const result = await window.TourAiForms.sendContactVerificationCode(
                    document.getElementById('email').value.trim()
                );
                if (!result.ok) {
                    if (result.error === 'rate_limited') {
                        throw new Error(
                            window.TourAiForms.rateLimitedMessage(result, 'contact.verify.rateLimited')
                        );
                    }
                    throw new Error(
                        window.TourAiForms?.mapSendVerificationError?.(result) ??
                            tContact('forms.error.generic')
                    );
                }
                window.TourAiEmailVerifyModal.setStatus(
                    tContact('contact.verify.resent'),
                    'success'
                );
                window.TourAiEmailVerifyModal.clearAndFocus();
            } catch (error) {
                window.TourAiEmailVerifyModal.setStatus(
                    window.TourAiForms?.toUserFacingErrorMessage?.(error)
                        ?? tContact('forms.error.generic'),
                    'error'
                );
            }
        }

        async function confirmVerificationCode(codeFromModal) {
            if (window.TourAiLoading?.isVisible()) {
                return;
            }

            const email = document.getElementById('email').value.trim();
            const code = codeFromModal || window.TourAiEmailVerifyModal.getCode();
            try {
                const result = await window.TourAiForms.verifyContactCode(email, code);
                if (!result.ok) {
                    const errorKey = {
                        invalid_code: ['contact.verify.invalidCode', 'El c�digo no coincide.'],
                        expired: ['contact.verify.expired', 'El c�digo ha caducado. Solicita uno nuevo.'],
                        too_many_attempts: ['contact.verify.rateLimited', 'Demasiados intentos. Espera unos minutos.'],
                        not_found: ['contact.verify.invalidCode', 'El c�digo no coincide.'],
                    }[result.error] ?? ['contact.verify.invalidCode', 'El c�digo no coincide.'];
                    window.TourAiEmailVerifyModal.setStatus(tContact(errorKey[0], errorKey[1]), 'error');
                    window.TourAiEmailVerifyModal.clearAndFocus();
                    return;
                }
                window.TourAiEmailVerifyModal.close();
                applyContactVerificationBox(email);
                validarForm();
            } catch (error) {
                window.TourAiEmailVerifyModal.setStatus(
                    tContact('contact.verify.invalidCode'),
                    'error'
                );
                window.TourAiEmailVerifyModal.clearAndFocus();
            }
        }

        // --- Validaci�n del formulario con feedback visual en email ---
        function validarForm() {
            const n = document.getElementById('name').value.trim();
            const e = document.getElementById('email').value.trim();
            const m = document.getElementById('message').value.trim();
            const p = document.getElementById('privacy').checked;
            const b = document.getElementById('submitBtn');
            const emailInput = document.getElementById('email');
            const emailError = document.getElementById('emailError');

            const isEmailValid = window.TourAiForms?.isValidEmail(e) ?? false;
            const showEmailError = e.length > 0 && !isEmailValid;
            const isEmailVerified = window.TourAiForms?.isContactEmailVerified(e) ?? false;

            emailInput.classList.toggle('input-invalid', showEmailError);
            if (emailError) {
                emailError.hidden = !showEmailError;
                if (showEmailError && window.TourAiI18n) {
                const msg = window.TourAiI18n.tOr(
                    'contact.email.invalid',
                    window.TourAiI18n.getLocale(),
                    null,
                    emailError.getAttribute('data-default-text') ?? ''
                );
                if (msg) emailError.textContent = msg;
            }
            }

            if (!isEmailValid) {
                window.TourAiForms?.clearContactEmailVerification();
                window.TourAiForms?.resetEmailRegistrationCheck();
                setVerificationBoxState({ visible: false, verified: false });
            } else {
                applyContactVerificationBox(e);
            }

            b.disabled = !(n.length > 0 && isEmailValid && isEmailVerified && m.length > 0 && p);
        }

        function scheduleContactEmailCheck(options) {
            const settings = options ?? {};
            window.TourAiForms?.scheduleEmailRegistrationCheck(
                document.getElementById('email').value,
                {
                    context: 'contact',
                    getEmail: () => document.getElementById('email').value,
                    onStateChange: validarForm,
                    autoOpenVerification: settings.autoOpenVerification === true,
                    onNeedsVerification: () => startEmailVerification(),
                }
            );
        }

        document.getElementById('email').addEventListener('input', function () {
            window.TourAiForms?.onContactEmailInput(this.value);
            validarForm();
        });
        document.getElementById('name').addEventListener('input', validarForm);
        document.getElementById('email').addEventListener('blur', function () {
            scheduleContactEmailCheck({ autoOpenVerification: true });
        });
        document.getElementById('message').addEventListener('input', validarForm);
        document.getElementById('privacy').addEventListener('change', validarForm);

        function bindOverlayClose(modalId, closeFn) {
            const modal = document.getElementById(modalId);
            if (!modal || modal.dataset.closeBound === 'true') {
                return;
            }

            modal.dataset.closeBound = 'true';
            modal.querySelector('.close-modal')?.addEventListener('click', (event) => {
                event.preventDefault();
                closeFn();
            });
        }

        bindOverlayClose('privacyModal', closeModal);
    </script>

    <script>
        async function submitContactForm() {
            if (window.TourAiLoading?.isVisible()) {
                return;
            }

            const form = document.getElementById('contactForm');
            const button = document.getElementById('submitBtn');
            const email = document.getElementById('email').value.trim();
            const locale = window.TourAiI18n?.getLocale() ?? 'es-ES';
            const originalText = window.TourAiI18n?.t('contact.submit', locale) ?? button.textContent;

            if (!window.TourAiForms.isContactEmailVerified(email)) {
                startEmailVerification();
                return;
            }

            try {
                button.disabled = true;
                button.textContent = tContact('contact.submitting');
                const result = await window.TourAiForms.submitContact(form);
                if (result.ok) {
                    form.reset();
                    window.TourAiForms.clearContactEmailVerification();
                    validarForm();
                    window.TourAiFeedback?.show({
                        type: 'success',
                        title: tContact('contact.success.title'),
                        message: tContact('contact.success'),
                    });
                } else {
                    const errorMessages = {
                        email_not_verified: tContact('contact.error.notVerified'),
                        smtp_not_configured: tContact('contact.error.smtp'),
                    };
                    throw new Error(errorMessages[result.error] ?? tContact('contact.error'));
                }
            } catch (e) {
                const rawMessage = typeof e?.message === 'string' ? e.message : '';
                const shouldVerify = rawMessage.toLowerCase().includes('verificar');
                window.TourAiFeedback?.show({
                    type: 'error',
                    message: window.TourAiForms?.toUserFacingErrorMessage?.(e)
                        ?? tContact('forms.error.generic'),
                    onClose: shouldVerify ? () => startEmailVerification() : undefined,
                });
            } finally {
                button.textContent = originalText;
                validarForm();
            }
        }
    </script>
