    <script>
function tDelete(key, fallback) {
            return window.TourAiDeleteAccount?.tOr(key, fallback) ?? fallback;
        }

        /* Never reuse a previous OTP proof when opening this page. */
        window.TourAiDeleteAccount?.resetVerification?.();

        function setVerificationBoxState({ visible, verified }) {
            const box = document.getElementById('emailVerificationBox');
            const message = document.getElementById('emailVerificationMessage');
            if (!box) return;

            if (!visible) {
                box.classList.remove('visible', 'verified', 'button-only');
                return;
            }

            box.classList.add('visible');
            box.classList.toggle('verified', !!verified);
            box.classList.remove('button-only');
            if (message) {
                message.hidden = !verified;
                if (verified) {
                    message.textContent = tDelete('deleteAccount.verify.success');
                }
            }
        }

        function validateForm() {
            const email = document.getElementById('email').value.trim();
            const confirmDelete = document.getElementById('confirmDelete').checked;
            const submitBtn = document.getElementById('submitBtn');
            const emailError = document.getElementById('emailError');
            const isEmailValid = window.TourAiForms?.isValidEmail(email) ?? false;
            const showEmailError = email.length > 0 && !isEmailValid;
            const isVerified = window.TourAiDeleteAccount?.isEmailVerified(email) ?? false;

            document.getElementById('email').classList.toggle('input-invalid', showEmailError);
            if (emailError) emailError.hidden = !showEmailError;

            if (!isEmailValid) {
                setVerificationBoxState({ visible: false, verified: false });
            } else {
                setVerificationBoxState({
                    visible: isVerified,
                    verified: isVerified,
                });
            }

            submitBtn.disabled = !(isEmailValid && isVerified && confirmDelete);
        }

        let deleteAutoVerifyEmail = null;
        let deleteAutoVerifyInFlight = false;

        async function maybeAutoStartDeleteVerification() {
            const email = document.getElementById('email').value.trim().toLowerCase();
            if (!window.TourAiForms?.isValidEmail(email)) {
                return;
            }
            if (window.TourAiDeleteAccount?.isEmailVerified(email)) {
                return;
            }
            if (deleteAutoVerifyInFlight || deleteAutoVerifyEmail === email) {
                return;
            }

            deleteAutoVerifyEmail = email;
            deleteAutoVerifyInFlight = true;
            try {
                await startEmailVerification();
            } catch {
                deleteAutoVerifyEmail = null;
            } finally {
                deleteAutoVerifyInFlight = false;
            }
        }

        document.getElementById('email').addEventListener('input', function () {
            const normalized = this.value.trim().toLowerCase();
            if (deleteAutoVerifyEmail && deleteAutoVerifyEmail !== normalized) {
                deleteAutoVerifyEmail = null;
            }
            window.TourAiDeleteAccount?.onEmailInput(this.value);
            validateForm();
        });
        document.getElementById('email').addEventListener('blur', function () {
            maybeAutoStartDeleteVerification();
        });
        document.getElementById('confirmDelete').addEventListener('change', validateForm);

        function openDeleteVerifyModal() {
            window.TourAiEmailVerifyModal.open({
                title: tDelete('deleteAccount.verify.title'),
                intro: tDelete('deleteAccount.verify.intro'),
                onConfirm: confirmVerificationCode,
                onResend: resendVerificationCode,
            });
        }

        async function startEmailVerification() {
            const email = document.getElementById('email').value.trim();
            try {
                const result = await window.TourAiDeleteAccount.sendVerificationCode(email);
                if (!result.ok) {
                    if (result.status === 404 || result.error === 'account_not_found') {
                        throw new Error(tDelete('deleteAccount.error.notFound'));
                    }
                    if (result.error === 'rate_limited') {
                        throw new Error(
                            window.TourAiForms?.rateLimitedMessage?.(result, 'deleteAccount.verify.rateLimited') ?? tDelete('deleteAccount.verify.rateLimited')
                        );
                    }
                    throw new Error(tDelete('forms.error.generic'));
                }
                openDeleteVerifyModal();
            } catch (error) {
                deleteAutoVerifyEmail = null;
                window.TourAiFeedback?.show({
                    type: 'error',
                    message: window.TourAiForms?.toUserFacingErrorMessage?.(error)
                        ?? tDelete('forms.error.generic'),
                });
            } finally {
                validateForm();
            }
        }

        async function resendVerificationCode() {
            try {
                const result = await window.TourAiDeleteAccount.sendVerificationCode(
                    document.getElementById('email').value.trim()
                );
                if (!result.ok) {
                    if (result.error === 'rate_limited') {
                        throw new Error(
                            window.TourAiForms?.rateLimitedMessage?.(result, 'deleteAccount.verify.rateLimited') ?? tDelete('deleteAccount.verify.rateLimited')
                        );
                    }
                    throw new Error(tDelete('forms.error.generic'));
                }
                window.TourAiEmailVerifyModal.setStatus(
                    tDelete('deleteAccount.verify.resent'),
                    'success'
                );
                window.TourAiEmailVerifyModal.clearAndFocus();
            } catch (error) {
                window.TourAiEmailVerifyModal.setStatus(
                    window.TourAiForms?.toUserFacingErrorMessage?.(error)
                        ?? tDelete('forms.error.generic'),
                    'error'
                );
            }
        }

        async function confirmVerificationCode(codeFromModal) {
            const emailInput = document.getElementById('email');
            const email = emailInput?.value?.trim() ?? '';
            const code = codeFromModal || window.TourAiEmailVerifyModal.getCode();
            const confirmBox = document.getElementById('confirmDelete');
            try {
                const result = await window.TourAiDeleteAccount.verifyCode(email, code);
                if (!result.ok) {
                    const errorMap = {
                        invalid_code: tDelete('deleteAccount.verify.invalidCode'),
                        expired: tDelete('deleteAccount.verify.expired'),
                        too_many_attempts: tDelete('deleteAccount.verify.rateLimited'),
                        not_found: tDelete('deleteAccount.verify.invalidCode'),
                    };
                    window.TourAiEmailVerifyModal.setStatus(
                        errorMap[result.error] ?? errorMap.invalid_code,
                        'error'
                    );
                    window.TourAiEmailVerifyModal.clearAndFocus();
                    return;
                }

                if (!window.TourAiDeleteAccount.isEmailVerified(email)) {
                    window.TourAiEmailVerifyModal.setStatus(
                        tDelete('forms.error.generic'),
                        'error'
                    );
                    window.TourAiEmailVerifyModal.clearAndFocus();
                    return;
                }

                window.TourAiEmailVerifyModal.close();
                validateForm();

                const focusNextStep = function () {
                    if (confirmBox && !confirmBox.checked) {
                        confirmBox.focus({ preventScroll: true });
                        confirmBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    } else {
                        document.getElementById('submitBtn')?.scrollIntoView({
                            behavior: 'smooth',
                            block: 'center',
                        });
                    }
                };

                window.TourAiFeedback?.show({
                    type: 'success',
                    title: tDelete('deleteAccount.verify.successTitle'),
                    message: tDelete('deleteAccount.verify.successNext'),
                    onClose: focusNextStep,
                });
            } catch (error) {
                window.TourAiEmailVerifyModal.setStatus(
                    tDelete('deleteAccount.verify.invalidCode'),
                    'error'
                );
                window.TourAiEmailVerifyModal.clearAndFocus();
            }
        }

        async function submitDeleteAccount() {
            const email = document.getElementById('email').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const originalText = tDelete('deleteAccount.submit', submitBtn.textContent);
            const confirmModal = confirm(tDelete('deleteAccount.finalConfirm'));
            if (!confirmModal) return;

            try {
                submitBtn.disabled = true;
                submitBtn.textContent = tDelete('deleteAccount.deleting');
                const result = await window.TourAiDeleteAccount.deleteAccount(email);
                if (!result.ok) {
                    if (result.error === 'email_not_verified') {
                        throw new Error(tDelete('deleteAccount.error.notVerified'));
                    }
                    throw new Error(tDelete('deleteAccount.error.failed'));
                }

                try {
                    if (window.TourAiAuth?.purgeAfterAccountDeletion) {
                        await window.TourAiAuth.purgeAfterAccountDeletion();
                    } else if (window.TourAiAuth?.signOut) {
                        await window.TourAiAuth.signOut();
                        window.TourAiAuth?.setRememberedEmail?.("");
                        window.TourAiAuth?.clearNavProfileCache?.();
                    }
                } catch {
                    try {
                        window.TourAiAuth?.setRememberedEmail?.("");
                        window.TourAiAuth?.clearNavProfileCache?.();
                        localStorage.removeItem("tourai-login-email");
                        localStorage.removeItem("tourai-login-remember");
                        sessionStorage.removeItem("tourai-web-verified-emails");
                        sessionStorage.removeItem("tourai-account-deletion-verified");
                    } catch {
                        /* ignore */
                    }
                }

                const goHome = function () {
                    window.location.replace('index.html');
                };

                window.TourAiFeedback?.show({
                    type: 'success',
                    message: tDelete('deleteAccount.success'),
                    onClose: goHome,
                });

                /* If the feedback modal is unavailable, leave immediately. */
                if (!window.TourAiFeedback?.show) {
                    goHome();
                }
            } catch (error) {
                window.TourAiFeedback?.show({ type: 'error', message: error.message });
                submitBtn.textContent = originalText;
                validateForm();
            }
        }

        validateForm();
    </script>

    <script>
        (function bootstrapSignedInDeleteFlow() {
            var started = false;
            var auth = window.TourAiAuth;
            if (!auth?.onAuthStateChanged) {
                return;
            }

            auth.onAuthStateChanged(function (user) {
                if (started || !user?.email) {
                    return;
                }
                started = true;

                var emailInput = document.getElementById('email');
                if (!emailInput) {
                    return;
                }

                emailInput.value = user.email;
                emailInput.readOnly = true;
                emailInput.setAttribute('aria-readonly', 'true');
                window.TourAiDeleteAccount?.onEmailInput(emailInput.value);
                validateForm();
                maybeAutoStartDeleteVerification();
            }).catch(function () {
                /* Guest flow: leave the form empty. */
            });
        })();
    </script>
