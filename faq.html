    <section class="download-zone waitlist-zone">
        <h2 data-i18n="index.waitlist.title"></h2>
        <p class="waitlist-intro" data-i18n="index.waitlist.intro"></p>
        <div class="waitlist-actions">
            <button type="button" class="waitlist-btn" onclick="openModal('iOS')" data-i18n="index.waitlist.ios"></button>

            <button type="button" class="link-button" onclick="openStoreUnsubscribe()" data-i18n="index.download.unsubscribe"></button>
        </p>

    <div id="subModal" class="modal">
        <div class="modal-content">
            <span class="close" role="button" data-i18n-aria-label="ui.close" aria-label="">&times;</span>
            <h3 style="color: var(--primary);" data-i18n="index.modal.title"></h3>
            <p id="modalIntro"></p>
            <strong id="platform" style="display:none"></strong>
            
            <form id="subscriptionForm" onsubmit="handleSubscription(event)" novalidate>
                <input type="email" id="email" name="email" data-i18n-placeholder="index.modal.email" placeholder="" required autocomplete="email">

                <div id="subEmailVerificationBox" class="verification-box">
                    <p id="subEmailVerificationMessage" data-i18n="contact.verify.success"></p>
                </div>
                
                <div class="consent-container">
                    <label>
                        <input type="checkbox" id="privacy" required> 
                        <span data-i18n-html="page.faq.modal.consent"></span>.</span>
                    </label>
                    <div id="termsBox" class="terms-box" data-i18n-html="page.faq.modal.privacyTerms"></div>
                </div>

                <button type="submit" id="submitBtn" disabled data-i18n="index.modal.submit"></button>
                <p class="subscription-manage-link">
                    <button type="button" class="link-button" onclick="openStoreUnsubscribe()" data-i18n="index.modal.unsubscribeLink"></button>
                </p>
            </form>
        </div>
